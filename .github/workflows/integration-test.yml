name: Integration Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Test against 47stats API
    if: github.event_name == 'workflow_dispatch' || vars.INTEGRATION_TESTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_STATS_API_URL: ${{ secrets.VITE_STATS_API_URL }}
      VITE_STATS_API_KEY: ${{ secrets.VITE_STATS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate integration-test secrets
        shell: bash
        run: |
          if [[ -z "${VITE_STATS_API_URL:-}" || -z "${VITE_STATS_API_KEY:-}" ]]; then
            echo "::error::VITE_STATS_API_URL and VITE_STATS_API_KEY must be configured as GitHub Actions secrets."
            exit 1
          fi

      - name: Run integration tests
        run: npm run test -- --run
